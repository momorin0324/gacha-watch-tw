name: Review character artwork
on:
  push:
    branches: [art-review-sigrika-nte]
    paths: ['.github/workflows/review-sources.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - name: Prepare reference images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageOps
          d=Path('assets/pool-art/review')
          # Original character focus and art-directed crop, without enlarging the source.
          shots=[
           ('sig-day','wuwa-sigrika-hall',(0,0,1,1),(.50,.17)),
           ('exe-board','nte-exe-board',(.38,.14,.92,.69),(.54,.18)),
           ('chiz-board','nte-shinku-board',(.42,.06,1,.65),(.53,.18)),
           ('chaos-board','nte-chaos-board',(.40,.085,.97,.65),(.56,.17))]
          out=Image.new('RGB',(790,4*130),'#19283c')
          for row,(src,slug,box,focus) in enumerate(shots):
           im=Image.open(d/(src+'.webp'));w,h=im.size
           im=im.crop((round(box[0]*w),round(box[1]*h),round(box[2]*w),round(box[3]*h)));im.thumbnail((1800,1200))
           im.save(d/(slug+'.webp'),quality=93,method=6)
           for x,width,height in [(0,370,82),(375,285,57),(665,125,72)]:
            thumb=ImageOps.fit(im,(width,height),centering=focus);out.paste(thumb,(x,row*130))
           ImageDraw.Draw(out).text((1,row*130+87),slug+' '+str(im.size))
          out.save(d/'crops.jpg',quality=90)
          PY
          git add assets/pool-art/review
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m 'Prepare illustration samples for framing review'
          git push
