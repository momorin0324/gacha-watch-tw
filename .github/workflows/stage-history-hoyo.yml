name: Verify historical character illustrations (staging)
on:
  push:
    branches: [work/history-character-art-hoyo-20261125]
    paths: ['art-work/hoyo.py', '.github/workflows/stage-history-hoyo.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow
      - run: python art-work/hoyo.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add assets/history-hoyo data/history-art-hoyo.json art-work/hoyo-report.json
          git commit -m "Populate verified historical splash artwork and local thumbnails" && git push
