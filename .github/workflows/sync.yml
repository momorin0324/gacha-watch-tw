name: Gacha Watch official sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_hoyolab_official.py'
      - 'scripts/parse_official_announcements.py'
      - 'scripts/collect_hoyolab_evidence.py'
      - 'scripts/apply_official_versions.py'
      - 'scripts/advance_versions.py'
      - 'scripts/sync_endfield.py'
      - 'tests/**'
      - 'config/official_accounts.json'
      - 'data/verified-releases.json'
      - '.github/workflows/sync.yml'
  schedule:
    # Check every hour, away from the top of the hour.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gacha-watch-official-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile scripts/sync_hoyolab_official.py scripts/collect_hoyolab_evidence.py scripts/parse_official_announcements.py
      - name: Test whitelist and field-level merge
        run: python -m unittest discover -s tests
      - name: Collect allowlisted official notices
        id: collect
        continue-on-error: true
        run: python scripts/sync_hoyolab_official.py
      - name: Preserve existing verified structured feeds
        id: legacy
        continue-on-error: true
        run: python scripts/sync.py
      - name: Sync Endfield official news
        id: endfield
        continue-on-error: true
        run: python scripts/sync_endfield.py
      - name: Publish official version lifecycle
        run: python scripts/apply_official_versions.py
      - name: Commit verified field-level updates
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/updates.json data/sync_status.json || test -n "$(git ls-files --others --exclude-standard data/sync_status.json)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/updates.json data/sync_status.json
            git commit -m 'Sync official game announcements'
            git pull --rebase
            git push
          fi
      - name: Report ingestion failures
        if: steps.collect.outcome == 'failure' || steps.legacy.outcome == 'failure' || steps.endfield.outcome == 'failure'
        run: |
          echo 'Some sources failed. Existing data was preserved; inspect data/sync_status.json.'
          exit 1
