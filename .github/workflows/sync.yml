name: Gacha Watch verified sync
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync.py
      - name: Commit verified changes
        run: |
          if ! git diff --quiet -- data/updates.json; then
            git config user.name 'gacha-watch-bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/updates.json
            git commit -m 'Update verified gacha data'
            git push
          fi
