name: 第十五輪 多卡池與UP名單擷取
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 取得最近成功的官方公告資料
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow collect-hoyolab-evidence.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$RUN_ID"
          mkdir -p official-evidence-diagnostic
          gh run download "$RUN_ID" -n 第十二輪-官方文章證據-待確認 -D official-evidence-diagnostic
      - name: 擷取多卡池時間及UP名單
        run: python scripts/extract_banner_groups.py
      - name: 保存待審報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 第十五輪-多卡池與UP名單-待確認
          path: banner-diagnostic/
          retention-days: 7
          if-no-files-found: warn
