name: 第十二輪 HoYoLAB 官方文章證據蒐集
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 擷取三款遊戲的公開公告及來源資訊
        run: python scripts/collect_hoyolab_evidence.py --limit 10
      - name: 保存來源證據（不發布）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 第十二輪-官方文章證據-待確認
          path: official-evidence-diagnostic/
          retention-days: 7
          if-no-files-found: warn
