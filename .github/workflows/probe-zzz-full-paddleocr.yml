name: 第十輪 絕區零繁體中文完整長圖辨識
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 快取辨識模型
        uses: actions/cache@v4
        with:
          path: ~/.paddleocr
          key: paddleocr-cht-v2-20261124
      - name: 安裝辨識工具
        run: |
          python -m pip install --upgrade pip
          python -m pip install paddlepaddle==2.6.2 paddleocr==2.9.1 Pillow
      - name: 完整掃描三張公告長圖
        run: python scripts/probe_zzz_full_paddleocr.py
      - name: 保存待確認報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 絕區零-完整長圖-待確認報告
          path: paddleocr-diagnostic/
          retention-days: 7
          if-no-files-found: warn
