name: 第十四輪 卡池公告分類與證據擷取
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 下載最近成功的官方公告蒐集報告
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh run list --workflow collect-hoyolab-evidence.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ]; then echo "找不到成功的第十二輪蒐集報告"; exit 1; fi
          mkdir -p official-evidence-diagnostic
          gh run download "$RUN_ID" -n 第十二輪-官方文章證據-待確認 -D official-evidence-diagnostic
      - name: 分類並擷取待確認的卡池證據
        run: python scripts/classify_banner_evidence.py
      - name: 保存第十四輪待確認報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 第十四輪-卡池分類與證據-待確認
          path: banner-diagnostic/
          retention-days: 7
          if-no-files-found: warn
