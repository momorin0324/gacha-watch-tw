name: Cache character artwork
on:
  schedule:
    - cron: '36 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gacha-watch-character-art
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and language support
        run: python -m pip install Pillow opencc-python-reimplemented==0.1.7
      - name: Resolve banner illustrations by game and character name
        run: python scripts/resolve_character_art.py
      - name: Publish newly matched artwork
        run: |
          git add data/discovered-art.json
          if test -d assets/pool-art/discovered; then git add assets/pool-art/discovered; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Cache matched banner character illustrations'
            git pull --rebase
            git push
          fi
