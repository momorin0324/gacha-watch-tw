<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官方公告｜二遊更新/卡池時程</title><style>
:root{color-scheme:dark}body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#0c1222;color:#edf2ff;margin:0}main{max-width:1080px;margin:auto;padding:26px 18px}a{color:#9acaff}header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#1e2c48;color:white;border:1px solid #3a5074;border-radius:10px;padding:10px 15px;cursor:pointer}button[aria-pressed=true]{background:#4267a7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card{border:1px solid #293954;background:#141e34;border-radius:14px;padding:18px;min-width:0}.card h3{font-size:17px;margin:8px 0;line-height:1.5}.muted{color:#b1bfd8;font-size:13px}.pill{font-size:12px;border:1px solid #496286;padding:3px 8px;border-radius:20px}.meta{display:flex;gap:8px;flex-wrap:wrap}.evidence{font-size:13px;color:#b8c5dd;white-space:pre-wrap;overflow-wrap:anywhere}.warn{color:#ffd79d}details{margin:12px 0;border-top:1px solid #293954;padding-top:10px}summary{cursor:pointer;color:#9acaff}details p{line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto}#status{margin:16px 0;color:#b1bfd8}footer{margin:28px 0;color:#b1bfd8;font-size:13px}</style></head><body><main><header><div><a href="./">← 返回首頁</a><h1>官方公告與更新紀錄</h1><p class="muted">官方帳號白名單來源，每日台灣時間 08:00、20:00 自動檢查</p></div></header><div class="tabs" id="tabs"><button data-game="all" aria-pressed="true">全部</button><button data-game="genshin">原神</button><button data-game="hsr">崩壞：星穹鐵道</button><button data-game="zzz">絕區零</button></div><div id="status" role="status">載入官方資料中…</div><section class="grid" id="cards"></section><footer>資料以官方文章為準。卡池時間若未核實時區，僅顯示公告原文，不顯示推測倒數。GitHub Actions 可能延遲執行。</footer></main><script>
const names={genshin:"原神",hsr:"崩壞：星穹鐵道",zzz:"絕區零"},cats={version:"版本",maintenance:"維護",banner:"卡池",preview:"前瞻",news:"公告"};let all=[],active="all";const cards=document.getElementById("cards"),status=document.getElementById("status");
function element(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function date(s){if(!s)return "時間未提供";const d=new Date(typeof s==="number"?s*1000:s);return isNaN(d)?"時間未提供":new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}).format(d)}
function render(){cards.replaceChildren();const filtered=all.filter(x=>active==="all"||x.game===active).sort((a,b)=>(Number(b.published_at)||0)-(Number(a.published_at)||0));for(const n of filtered.slice(0,100)){const c=element("article","card"),m=element("div","meta");m.append(element("span","pill",names[n.game]),element("span","pill",cats[n.category]||"公告"),element("span","muted",date(n.published_at)));c.append(m,element("h3","",n.title));if(n.version)c.append(element("p","muted","公告版本："+n.version));if(n.banner_evidence){c.append(element("p","warn","卡池時間：待確認時區"));for(const line of n.banner_evidence.time_evidence.slice(0,2))c.append(element("p","evidence",line))}if(n.preview)c.append(element("p","muted","前瞻消息，請以官方公告為準"));if(n.traditional_chinese_excerpt){const d=document.createElement("details"),summary=document.createElement("summary");summary.textContent="在本站閱讀公告摘要（優先繁體中文）";d.append(summary,element("p","evidence",n.traditional_chinese_excerpt));c.append(d)}const a=element("a","","前往 HoYoLAB 官方原文（語言依官方網站設定）");const officialUrl=new URL(n.url);officialUrl.searchParams.set("lang","zh-tw");a.href=officialUrl.toString();a.target="_blank";a.rel="noopener noreferrer";c.append(a);cards.append(c)}if(!filtered.length)cards.append(element("p","muted","尚無符合條件的公告"))}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-game]");if(!b)return;active=b.dataset.game;for(const x of document.querySelectorAll("[data-game]"))x.setAttribute("aria-pressed",String(x===b));render()});
fetch("./data/updates.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{all=(data.games||[]).flatMap(g=>(g.official_announcements||[]).map(n=>({...n,game:g.id})));status.textContent="最近同步："+date(data.updated_at)+"（台灣時間）｜共 "+all.length+" 篇官方公告";render()}).catch(e=>{status.textContent="目前無法載入同步資料："+e.message});
</script></body></html>
